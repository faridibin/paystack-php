name: Tests

on:
  workflow_call:

jobs:

  # ── Unit tests + static analysis ─────────────────────────────────────────────
  # The whole suite is mock-based (Mockery/Pest) — no external services needed.
  # Runs across the supported PHP range. PHP 8.1 is the real floor (readonly
  # properties + nesbot/carbon ^3), and 8.4 guards against new deprecations.
  unit:
    name: Unit — PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl, mbstring
          coverage: none

      # composer.lock is not committed (this is a library), so the cache key is
      # derived from composer.json instead.
      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: php-${{ matrix.php }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run unit tests
        run: vendor/bin/pest --colors=always

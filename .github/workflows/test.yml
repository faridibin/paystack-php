name: Tests

on:
  workflow_call:

jobs:

  # ── Unit tests + static analysis ─────────────────────────────────────────────
  # The whole suite is mock-based (Mockery/Pest) — no external services needed.
  # Floor is PHP 8.2 here because the dev toolchain (pestphp/pest ^3) requires it;
  # 8.4 guards against new deprecations. Runtime support for 8.1 is verified
  # separately by the `floor` job below.
  unit:
    name: Unit — PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl, mbstring
          coverage: none

      # composer.lock is not committed (this is a library), so the cache key is
      # derived from composer.json instead.
      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: php-${{ matrix.php }}-composer-

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run unit tests
        run: vendor/bin/pest --colors=always

  # ── PHP 8.1 runtime floor ────────────────────────────────────────────────────
  # The library supports PHP 8.1, but the dev toolchain (Pest 3) requires 8.2, so
  # the full suite can't run there. `composer install` is no help either: even with
  # --no-dev, Composer still *resolves* require-dev platform constraints, and Pest's
  # `php ^8.2` blocks resolution on 8.1. A syntax lint needs no dependencies, so
  # this leg parses every source file on PHP 8.1 — catching any 8.2-only syntax and
  # backing the `"php": "^8.1"` claim in composer.json.
  floor:
    name: Floor — PHP 8.1 (lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint sources on PHP 8.1
        run: find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
